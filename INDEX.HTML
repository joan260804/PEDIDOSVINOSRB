<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pedidos RB</title>
<script>
  // CONFIGURACIÓN: Tu nueva URL del script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyjpOloOpcnWWmssLEBBTl_g_rJBMnTkOiKkl6R9mOvWo4eVuuBtN0GSNIlX-D03-S/exec";

  // Función para guardar el pedido
  async function submitOrder() {
    const btn = document.getElementById("btn-finalizar");
    const orderData = { /* ... aquí recoges tus datos del carrito ... */ };
    
    // Indicador de carga
    btn.disabled = true;
    btn.innerText = "Enviando pedido...";

    try {
      const response = await fetch(SCRIPT_URL + "?action=saveOrder&order=" + encodeURIComponent(JSON.stringify(orderData)));
      const result = await response.json();
      
      if (result.ok) {
        alert("¡Pedido realizado con éxito y correos enviados!");
      } else {
        alert("Error al guardar: " + result.error);
      }
    } catch (e) {
      alert("Error de conexión con el servidor.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Finalizar Pedido";
    }
  }
</script>
</head>
<body>
  <button id="btn-finalizar" onclick="submitOrder()">Finalizar Pedido</button>
</body>
</html>
